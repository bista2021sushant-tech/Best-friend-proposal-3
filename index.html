<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will You Be My Bestie?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Prevents accidental mobile refresh pulling or zooming */
            touch-action: none; 
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 85%;
            z-index: 5;
        }

        h1 {
            color: #ff4757;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: #57606f;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 60px;
            position: relative;
        }

        button {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #yesBtn {
            background-color: #2ed573;
            color: white;
            box-shadow: 0 4px 10px rgba(46, 213, 115, 0.3);
        }

        #noBtn {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
            position: absolute;
            left: 55%; 
            transition: all 0.1s ease;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Main Card -->
    <div class="container" id="mainCard">
        <h1>Will You Be My Bestie? 🤝✨</h1>
        <p>Try tapping No... I dare you!</p>
        <div class="buttons">
            <button id="yesBtn" onclick="acceptProposal()">Yes!</button>
            <!-- ontouchstart fires instantly on mobile touch -->
            <button id="noBtn" ontouchstart="moveButton(event)" onmouseover="moveButton(event)" onclick="moveButton(event)">No</button>
        </div>
    </div>

    <!-- Success Card -->
    <div class="container hidden" id="successCard">
        <h1>Yay! 🎉💖</h1>
        <p>Besties for life! You couldn't escape it anyway.</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        function moveButton(event) {
            // Prevent default behavior to stop any accidental ghost clicks
            if (event) event.preventDefault();

            // Screen boundaries minus button size and padding to ensure it stays fully on screen
            const padding = 60;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            // Generate random positions
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Teleport button
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${Math.max(padding / 2, randomX)}px`;
            noBtn.style.top = `${Math.max(padding / 2, randomY)}px`;
        }

        function acceptProposal() {
            document.getElementById('mainCard').classList.add('hidden');
            document.getElementById('successCard').classList.remove('hidden');
        }
    </script>

</body>
</html>
